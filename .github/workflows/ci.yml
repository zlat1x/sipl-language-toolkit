name: Python validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install toolkit and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint for syntax, unused names, and critical errors
        run: python -m ruff check src tests --select E4,E7,E9,F
      - name: Unit, integration and coverage tests
        run: python -m pytest --cov=sipl --cov-branch --cov-report=term-missing --cov-fail-under=85
      - name: Independent conformance
        run: python -m sipl.conformance conformance/cases
      - name: Build sdist and wheel
        run: python -m build
