[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipl-language-toolkit"
version = "1.0.0"
description = "SIPL syntax, execution, semantic terms and conformance toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Zlata Dovbyk"}]
license = {text = "MIT"}
keywords = ["SIPL", "interpreter", "formal semantics", "parser"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
sipl = "sipl.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "build>=1,<3", "ruff>=0.8,<1", "lark>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["sipl"]
branch = true

[tool.coverage.report]
show_missing = true
omit = ["*/__main__.py"]
